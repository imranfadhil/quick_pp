site_name: quick_pp
site_description: Comprehensive Python package and web platform for deterministic and probabilistic petrophysical evaluation, SCAL & relative permeability modeling, multi-well FWL optimization, stratigraphic normalization, and geomodel log upscaling.
site_author: Imran Fadhil
site_url: https://quick-pp.readthedocs.io/
repo_url: https://github.com/imranfadhil/quick_pp
repo_name: imranfadhil/quick_pp
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocs-jupyter:
      include:
        - "tutorials/*.ipynb"
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart & CLI: getting-started/usage.md
      - Langflow Assistant: getting-started/langflow-chat.md
  - Visual Tutorials (Notebooks):
      - Overview: tutorials/index.md
      - "04 — FDP & PIML Showcase":
          - Master FDP & PIML Showcase: tutorials/04_fdp_and_piml_showcase.ipynb
          - "04.1 Probabilistic CPI & FWL Optimization": tutorials/04_1_probabilistic_cpi_and_fwl_optimization.ipynb
          - "04.2 SCAL, RelPerm & Log Blocking": tutorials/04_2_scal_relperm_and_log_blocking.ipynb
          - "04.3 PIML & Conformal Prediction": tutorials/04_3_piml_and_conformal_prediction.ipynb
      - "03 — Deterministic & Carbonate Workflows":
          - "03.1 Carbonate Lithology & Porosity": tutorials/03_1_carbonate_lithology_porosity.ipynb
          - "03.2 Carbonate Rock Typing (FZI)": tutorials/03_2_carbonate_rock_typing_fzi.ipynb
          - "03.3 Carbonate Saturation (J-Function)": tutorials/03_3_carbonate_saturation_j_fzi.ipynb
          - "03.4 Carbonate Single-Well Evaluation": tutorials/03_4_carbonate_single.ipynb
          - "03.5 Carbonate Multi-Well Batch": tutorials/03_5_carbonate_batch.ipynb
          - "03.6 Carbonate Volume Uncertainty": tutorials/03_6_carbonate_volume_uncertainty.ipynb
          - "Clastic Sand-Silt-Clay (Single Well)": tutorials/03_qpp_ssc_single.ipynb
          - "Clastic Sand-Silt-Clay (Multi-Well Batch)": tutorials/03_qpp_ssc_batch.ipynb
          - "Sand-Shale Evaluation": tutorials/03_qpp_ss_single.ipynb
          - "Thin-Bed Evaluation": tutorials/03_qpp_ts_single.ipynb
  - API Reference:
      - Package Overview: api/overview.md
      - QA/QC & Normalization (qaqc): api/qaqc.md
      - Lithology Inversion (lithology): api/lithology.md
      - Porosity (porosity): api/porosity.md
      - Saturation & FWL Optimizer (saturation): api/saturation.md
      - Permeability (permeability): api/permeability.md
      - Rock & Fluid Typing (rock_type): api/rock_type.md
      - Core Analysis (core_analysis): api/core_analysis.md
      - SCAL & Relative Permeability (scal): api/scal.md
      - Uncertainty & Monte Carlo (uncertainty): api/uncertainty.md
      - Log Blocking & Upscaling (upscaling): api/upscaling.md
      - Reservoir Summary (ressum): api/ressum.md
      - Rock Physics (rock_physics): api/rock_physics.md
      - Machine Learning & Conformal (machine_learning): api/machine_learning.md
      - Plotting, LAS & Utilities: api/plotter.md
  - Community:
      - Contributing: community/contributing.md
      - Changelog: community/changelog.md
      - Credits: community/authors.md

