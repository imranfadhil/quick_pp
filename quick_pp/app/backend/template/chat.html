<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quick_pp Petrophysical AI Assistant</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f8fafc;
            color: #0f172a;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 20px;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        select, input, button {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
        }
        button {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            cursor: pointer;
            font-weight: 600;
        }
        #messages {
            min-height: 320px;
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 16px;
            background: #f8fafc;
            margin-bottom: 12px;
            white-space: pre-wrap;
            font-size: 13px;
        }
        .msg-user {
            font-weight: 600;
            color: #1d4ed8;
            margin-top: 12px;
        }
        .msg-bot {
            margin-top: 6px;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>quick_pp Petrophysical AI Assistant & MCP</h1>
        <p style="margin:0;color:#475569;font-size:13px;">
            Interactive subsurface agent powered by the built-in Petrophysical MCP Server.
        </p>
        <div class="controls">
            <select id="projectSelect" onchange="loadWells()">
                <option value="">Select Project...</option>
            </select>
            <select id="wellSelect">
                <option value="">Select Well...</option>
            </select>
        </div>
        <div id="messages">Select a project and well, then ask a petrophysical question below.</div>
        <div style="display:flex;gap:8px;">
            <input id="promptInput" type="text" style="flex:1;" placeholder="e.g., Inspect well and summarize zonal pay & conformal bounds" onkeydown="if(event.key==='Enter') sendMessage()" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        const API_BASE = '{{ api_base_url }}';
        async function loadProjects() {
            const res = await fetch(`${API_BASE}/database/projects`);
            const projects = await res.json();
            const sel = document.getElementById('projectSelect');
            sel.innerHTML = '<option value="">Select Project...</option>';
            (projects || []).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.project_id || p.id;
                opt.textContent = p.name;
                sel.appendChild(opt);
            });
        }
        async function loadWells() {
            const pid = document.getElementById('projectSelect').value;
            const sel = document.getElementById('wellSelect');
            sel.innerHTML = '<option value="">Select Well...</option>';
            if (!pid) return;
            const res = await fetch(`${API_BASE}/workspace/projects/${pid}/summary`);
            const summary = await res.json();
            (summary.wells || []).forEach(w => {
                const opt = document.createElement('option');
                opt.value = w.name;
                opt.textContent = w.name;
                sel.appendChild(opt);
            });
        }
        async function sendMessage() {
            const input = document.getElementById('promptInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            const box = document.getElementById('messages');
            const pid = document.getElementById('projectSelect').value;
            const well = document.getElementById('wellSelect').value;
            box.innerHTML += `\n\n> ${msg}\n`;
            const res = await fetch(`${API_BASE}/assistant/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: msg,
                    project_id: pid ? Number(pid) : null,
                    well_name: well || null,
                    provider: 'native_mcp'
                })
            });
            const data = await res.json();
            box.innerHTML += `${data.reply || data.detail || 'No response'}\n`;
            box.scrollTop = box.scrollHeight;
        }
        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>
</body>
</html>
