services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-qpp_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_this_strong_password}
      - POSTGRES_DB=${POSTGRES_DB:-quick_pp}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qpp_user} -d ${POSTGRES_DB:-quick_pp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qpp-network

  qpp-backend:
    image: imranfadhil86/quick_pp-backend:latest
    build:
      context: ../../..
      dockerfile: quick_pp/app/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - QPP_DATABASE_URL=${QPP_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-qpp_user}:${POSTGRES_PASSWORD:-change_this_strong_password}@postgres:5432/${POSTGRES_DB:-quick_pp}}
      - POSTGRES_USER=${POSTGRES_USER:-qpp_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_this_strong_password}
      - POSTGRES_DB=${POSTGRES_DB:-quick_pp}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - QPP_AUTH_SECRET_KEY=${QPP_AUTH_SECRET_KEY:-}
      - QPP_ADMIN_USERNAME=${QPP_ADMIN_USERNAME:-admin}
      - QPP_ADMIN_EMAIL=${QPP_ADMIN_EMAIL:-admin@quickpp.local}
      - QPP_ADMIN_PASSWORD=${QPP_ADMIN_PASSWORD:-QuickPP@Admin2026!}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TLS=${SMTP_TLS:-true}
    volumes:
      - ${QPP_HOST_UPLOADS_DIR:-../../../uploads}:/code/uploads
      - ${QPP_HOST_DATA_DIR:-../../../data}:/code/data
      - ../..:/venv/lib/python3.11/site-packages/quick_pp
      - ../..:/code/quick_pp
    networks:
      - qpp-network

  qpp-frontend:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    # mount the frontend source so local edits reflect inside container
    volumes:
      - ../frontend:/app:delegated
      - /app/node_modules
    depends_on:
      - qpp-backend
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-}
      - HOST=0.0.0.0
      - PORT=5469
      - NODE_OPTIONS=--max-old-space-size=${FRONTEND_MAX_OLD_SPACE:-4096}
    # Install deps (if needed), build the app (if build/index.js is missing), and run the production server
    command: sh -c "if [ ! -d node_modules/@sveltejs/kit ]; then npm install; fi && if [ ! -f build/index.js ]; then npm run build; fi && exec node build/index.js"
    networks:
      - qpp-network

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - qpp-frontend
      - qpp-backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Bound to localhost only: public access goes through the Cloudflare Tunnel.
    # Set WEB_BIND=0.0.0.0 to expose directly (not recommended).
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    networks:
      - qpp-network

  # Cloudflare Quick Tunnel — free random *.trycloudflare.com HTTPS URL.
  # No Cloudflare account or token required. The URL changes on every restart.
  quicktunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate --url http://web:80
    networks:
      - qpp-network

volumes:
  postgres_data:

networks:
  qpp-network:
    driver: bridge
