server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS resolver so container restarts/recreations with new IPs never cause 502 Bad Gateway
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Allow large LAS and ancillary file uploads
    client_max_body_size 100m;

    # Proxy API requests and Swagger docs to the FastAPI backend
    location ~ ^/(quick_pp|docs|redoc|openapi\.json|static|qpp_assistant) {
        set $backend_upstream http://qpp-backend:6312;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy everything else to the SvelteKit frontend server
    location / {
        set $frontend_upstream http://qpp-frontend:5469;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
