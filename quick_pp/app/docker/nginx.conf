server {
    listen 80;
    server_name _;

    # Allow large LAS and ancillary file uploads
    client_max_body_size 100m;

    # Proxy API requests and Swagger docs to the FastAPI backend
    location ~ ^/(quick_pp|docs|redoc|openapi\.json|static|qpp_assistant) {
        proxy_pass http://qpp-backend:6312;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy everything else to the SvelteKit frontend server
    location / {
        proxy_pass http://qpp-frontend:5469;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

