worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Disable disk access_log so public demo traffic never fills container storage
    access_log off;
    sendfile on;
    keepalive_timeout 65;

    # Guardrail 1: Enforce 5 MB max upload payload in the public Interactive Live Demo
    client_max_body_size 5m;

    # Guardrail 2: Real visitor IP via Cloudflare Tunnel (keep DEMO_BIND=127.0.0.1 when using CF)
    map $http_cf_connecting_ip $client_real_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }
    limit_req_zone $client_real_ip zone=demo_rate_limit:5m rate=180r/m;
    limit_req_zone $client_real_ip zone=demo_telemetry_limit:2m rate=30r/m;
    limit_req_zone $client_real_ip zone=demo_heavy_limit:2m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    server {
        listen 7860;
        server_name _;

        # Standard browser hardening headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Guardrail 3: Hide Swagger/ReDoc/OpenAPI schema from public internet scanners
        location ~ ^/(docs|redoc|openapi\.json) {
            return 404;
        }

        # Isolated rate-limit bucket for lightweight session heartbeats so they never starve API calls
        location /quick_pp/demo/ {
            limit_req zone=demo_telemetry_limit burst=12 nodelay;
            proxy_pass http://127.0.0.1:6312;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # Guardrail 4: Stricter rate limit on CPU/LLM/PDF-heavy endpoints
        location ~ ^/(quick_pp/(assistant/chat|mcp)|(?:quick_pp|api/v1)/projects/[^/]+/reports/(generate|[^/]+/(enhance|pdf))) {
            limit_req zone=demo_heavy_limit burst=6 nodelay;
            proxy_pass http://127.0.0.1:6312;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Proxy API requests and static report assets to the FastAPI backend
        location ~ ^/(quick_pp|api/v1|static|qpp_assistant) {
            limit_req zone=demo_rate_limit burst=60 nodelay;
            proxy_pass http://127.0.0.1:6312;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Serve immutable SvelteKit JS/CSS bundles & static icons without rate-limit overhead
        location ~ ^/(_app/|favicon\.ico|robots\.txt) {
            proxy_pass http://127.0.0.1:5469;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy everything else to the SvelteKit frontend server
        location / {
            limit_req zone=demo_rate_limit burst=60 nodelay;
            proxy_pass http://127.0.0.1:5469;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
